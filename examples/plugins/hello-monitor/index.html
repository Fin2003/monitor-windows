<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor 显示插件</title>
<style>html,body{margin:0;height:100%;background:#101114;color:#f5f5f7;font:16px system-ui}body{display:grid;place-items:center}.card{padding:clamp(24px,6vw,60px);text-align:center}svg{color:#61a4ff}h1{font-size:clamp(24px,5vw,48px);font-weight:600;letter-spacing:-.03em}p{color:#9c9ca6;line-height:1.8}small{color:#61a4ff;font-variant-numeric:tabular-nums}</style>
<div class="card"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><h1>插件已加载</h1><p>这是独立的 HTML 显示页面。<br>修改这份示例，制作自己的副屏内容。</p><small id="viewport"></small></div>
<script>function render(){document.getElementById('viewport').textContent=innerWidth+' × '+innerHeight;}addEventListener('resize',render);render();</script></html>
